<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zöstere.nl</title>
<meta name="description" content="Zöstere.nl — het dialect van Susteren online.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d5e63'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23e3b448'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Sans:wght@500;600&display=swap">
<style>
:root{--paper:#f5f6f2;--sheet:#fff;--ink:#1c2629;--muted:#5a676b;--line:#d5dbd8;--maas:#0d5e63;--goud:#b7860f;
  --display:"Zilla Slab",Rockwell,Georgia,serif;--body:"Source Serif 4",Georgia,serif;--ui:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#11181a;--sheet:#182124;--ink:#e4ebe9;--muted:#9aa8a9;--line:#2c3a3d;--maas:#63bfc0;--goud:#e3b448;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);min-height:100vh;display:grid;place-items:center;padding:48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:620px;display:grid;gap:22px}
h1{font-family:var(--display);font-size:clamp(44px,9vw,76px);line-height:1;margin:0}
h1 span{color:var(--goud)}
p{font-family:var(--body);font-size:19px;line-height:1.55;color:var(--muted);margin:0}
a.card{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
a.card:hover,a.card:focus-visible{border-color:var(--maas);outline:none}
a.card b{font-family:var(--display);font-size:24px;font-weight:600;color:var(--maas)}
a.card span{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Zöstere<span>.nl</span></h1>
  <p>Het dialect van Susteren, online. Gemaakt met de Zösterse Woordelies en de verhalen uit de Heemklank van de Natuurvrienden Susteren.</p>
  <a class="card" href="/vertaler/"><b>Zösters Vertaler →</b><span>Zet Nederlands of een ander Limburgs dialect om naar het Zösters, of spreek je tekst in.</span></a>
</main>
</body>
</html>
