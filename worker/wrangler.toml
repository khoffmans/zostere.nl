name = "zostere-vertaler"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
MODEL = "claude-sonnet-5-5"
# Alleen om lokaal te testen, bijv. "http://localhost:8000". Leeg laten voor live.
DEV_ORIGIN = ""

# Hoe vaak één bezoeker (IP-adres) per minuut iets mag doen.
# Geeft `wrangler deploy` hier een fout op, haal deze twee blokken dan weg:
# de worker werkt ook zonder, alleen zonder limiet per bezoeker.
[[ratelimits]]
name = "LIMIT_VERTAAL"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 8
  period = 60

[[ratelimits]]
name = "LIMIT_INZEND"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60
